name: Update Case Data

on:
  schedule:
    - cron: "0 12 * * *"   # daily at 12:00 UTC - adjust as needed
  workflow_dispatch: {}     # adds a manual "Run workflow" button on GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("httr","jsonlite","dplyr","stringr"))'

      - name: Generate cases_data.json from Airtable
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: Rscript airtable_pipeline.r

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cases_data.json
          git diff --cached --quiet || git commit -m "Auto-update case data from Airtable"
          git push
